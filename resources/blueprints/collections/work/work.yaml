title: Work
tabs:
  main:
    display: Main
    sections:
      -
        display: 'Homepage Content'
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: feature_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Feature Image'
          -
            handle: proof
            field:
              type: text
              display: Proof
          -
            handle: highlight
            field:
              type: text
              display: Highlight
      -
        display: Contents
        fields:
          -
            handle: video_asset
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Local Video'
          -
            handle: video_url
            field:
              type: text
              display: 'Video URL'
          -
            handle: banner_header
            field:
              type: text
              display: 'Banner Header'
          -
            handle: content_field
            field:
              type: replicator
              display: Content
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    copy:
                      display: Copy
                      icon: text-formatting-type-cursor
                      fields:
                        -
                          handle: content_header
                          field:
                            type: text
                            display: 'Content Header'
                        -
                          handle: content_copy
                          field:
                            buttons:
                              - h1
                              - h2
                              - h3
                              - bold
                              - italic
                              - alignleft
                              - aligncenter
                              - alignright
                              - unorderedlist
                              - orderedlist
                              - removeformat
                              - quote
                              - anchor
                              - image
                              - table
                              - horizontalrule
                            remove_empty_nodes: false
                            type: bard
                            display: Content
                    media_items:
                      display: media_items
                      icon: media-image-picture-orientation
                      fields:
                        -
                          handle: image
                          field:
                            max_files: 1
                            container: assets
                            type: assets
                            display: image
                        -
                          handle: thumbnail
                          field:
                            max_files: 1
                            container: assets
                            type: assets
                            display: thumbnail
                        -
                          handle: video_asset
                          field:
                            max_files: 1
                            container: assets
                            type: assets
                            display: 'Local Video'
                        -
                          handle: video_url
                          field:
                            type: text
                            display: 'Video URL'
                        -
                          handle: media_width
                          field:
                            options:
                              -
                                key: full
                                value: Full
                              -
                                key: half
                                value: Half
                              -
                                key: third
                                value: Third
                              -
                                key: two_thirds
                                value: 'Two Thirds'
                            default: full
                            type: select
                            display: width
                        -
                          handle: media_ratio
                          field:
                            options:
                              -
                                key: square
                                value: Square
                              -
                                key: video
                                value: Video
                              -
                                key: portrait
                                value: Portrait
                            default: video
                            type: select
                            display: 'Aspect Ratio'
      -
        display: Stats
        fields:
          -
            handle: stat1
            field:
              buttons:
                - h1
                - h2
                - h3
                - h4
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - quote
                - anchor
                - image
                - table
              remove_empty_nodes: false
              type: bard
              display: 'Hero Stat'
          -
            handle: stat2
            field:
              buttons:
                - h1
                - h2
                - h3
                - h4
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - quote
                - anchor
                - image
                - table
              remove_empty_nodes: false
              type: bard
              display: 'Secondary Stat'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - work
              max_items: 1
              listable: false
              localizable: true
